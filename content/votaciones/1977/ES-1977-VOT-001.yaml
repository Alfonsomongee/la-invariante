  intento_de_refutacion: >-
    Se leyó íntegramente el PDF original C_1977_024.PDF (págs. 954–974) para confirmar que la
    votación fue electrónica sin relación nominal impresa; por ello no se inventan recuentos por
    grupo, se registra el sentido declarado en cada explicación de voto (incluyendo PCE y PSUC en
