titulo: Votación conjunta de la Ley de Amnistía en el Congreso el 14 de octubre de 1977
resumen: >-
  El Congreso aprobó el 14 de octubre de 1977 la proposición conjunta de Ley de Amnistía impulsada
  por UCD, PSOE, PCE, Minoría Vasco-Catalana, Mixto y PSC-PSOE con 296 votos a favor, 2 en contra,
  18 abstenciones y 1 nulo sobre 317 emitidos.
