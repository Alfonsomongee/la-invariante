descargo: >-
  Los grupos proponentes (UCD, PSOE, PSC-PSOE, PCE-PSUC, Minorías Catalana y Vasca y PSP en el Mixto)
  justificaron el voto conjunto como cierre político de la dictadura y liberación de presos
  políticos. Alianza Popular se abstuvo alegando que las amnistías sucesivas debilitaban el Estado
  de Derecho; Francisco Letamendia (EE) e Hipólito Gómez de las Roces (CAIC) explicaron su
  abstención por motivos distintos. Al no imprimirse relación nominal del voto electrónico, no
  consta en el Diario de Sesiones la identidad de los 2 votos en contra ni el reparto individual
  exacto de las 18 abstenciones.
