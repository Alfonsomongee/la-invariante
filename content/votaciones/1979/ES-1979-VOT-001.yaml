  intento_de_refutacion: >-
    Se verificaron uno a uno los nombres de los 183 síes, 149 noes (148 listados más Silva
    Cienfuegos incorporado en pág. 61), 8 abstenciones (los 8 diputados de CiU) y 10 ausencias
    (entre ellas los 3 electos de HB). La justificación reglamentaria de Lavilla y el turno
    vespertino posterior constan íntegramente en descargo.
