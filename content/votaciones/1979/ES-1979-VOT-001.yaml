descargo: >-
  La Presidencia invocó el artículo 23 del Reglamento provisional de 1977 (anterior a la
  Constitución) para dictar la resolución del 29 de marzo sobre el desarrollo de la sesión y
  habilitó un turno de intervenciones de todas las formaciones políticas a partir de las 17:10 de
  la tarde, una vez proclamada la investidura. En el recuento inicial (pág. 62) se anunciaron 184
  síes y 7 abstenciones, rectificados a 183 y 8 tras advertirlo Miquel Roca (CiU).
