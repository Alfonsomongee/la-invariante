    url: https://www.congreso.es/public_oficiales/L1/CONG/DS/PL/PL_003.PDF
    sha256: b06949ce58e4e1abcdd3403bbd9fd67198caa3d48d12713ae03a110bc2e662de
    capturado: "2026-11-25"
    pagina: "31-33, 57-62"
    fragmento: >-
      Sesión Plenaria de Investidura celebrada el viernes, 30 de marzo de 1979. Presidencia
      interina del Excmo. Sr. D. Landelino Lavilla Alsina. [...] el señor González Márquez (PSOE)
      plantea una cuestión de orden [...]. A continuación el señor Carrillo Solares (PCE) [...].
      Seguidamente el señor Fraga Iribarne (CD) [...]. Contestación del señor Presidente interino
      en el sentido de que no ha lugar a admitir las cuestiones de orden planteadas [...].
      Terminado el discurso del señor Suárez González [...], se procede seguidamente a la votación
      [UCD, CD, PSA-PA, PAR, UPN a favor; CiU abstención]. [...] Revisados los cómputos, el
      resultado es el siguiente: 183 síes, 149 noes, ocho [8] abstenciones y 10 ausencias [votos
      emitidos, 340]. En consecuencia, el Congreso de los Diputados [...] otorga su confianza al
      candidato don Adolfo Suárez González.
