titulo: Primera investidura constitucional votada sin debate previo en el Congreso (30 de marzo de 1979)
resumen: >-
  El 30 de marzo de 1979, el Presidente interino Landelino Lavilla impidió debatir antes de votar
  la investidura de Adolfo Suárez pese a las cuestiones de orden de PSOE, PCE, CD y otros grupos;
  Suárez obtuvo 183 votos a favor (UCD, CD, PSA-PA, PAR y UPN), 149 en contra y 8 abstenciones
  (CiU) sobre 340 emitidos.
