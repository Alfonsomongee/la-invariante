descargo: >-
  Los grupos partidarios del texto defendieron el consenso constitucional como marco común de
  libertades y Estado de Derecho. El PNV explicó su abstención por el encaje de los derechos
  históricos forales (Xabier Arzalluz, págs. 5185-5187); Alianza Popular votó dividida (cinco votos
  en contra y tres abstenciones); en UCD consta la abstención individual de Jesús Aizpún Tuero. En
  la lectura de viva voz en pág. 5185 se pronunciaron 326 a favor y 13 abstenciones, corregidos en
  el sumario oficial (pág. 5179) a 325 y 14 conforme a los 14 nombres impresos en la lista nominal.
