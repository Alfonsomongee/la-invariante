titulo: Votación nominal definitiva de la Constitución Española en el Congreso (31 de octubre de 1978)
resumen: >-
  El Congreso aprobó en votación nominal el 31 de octubre de 1978 el texto definitivo de la
  Constitución Española con 325 votos a favor (UCD, PSOE, PSC-PSOE, PCE-PSUC, Minoría Catalana y
  parte de AP), 6 en contra (cinco de AP y Letamendía) y 14 abstenciones (PNV, tres de AP, ERC y
  dos diputados) sobre 345 emitidos.
