descartes:
  - pista: Ley 53/1977, de 14 de noviembre (suplemento de crédito de 4.295.758.648 pesetas para Hunosa)
    motivo_descarte: >-
      Hunosa pertenecía ya al Instituto Nacional de Industria desde 1967; aunque se financiaron
      pérdidas acumuladas mediante anticipos del Banco de España, no consta rescate directo de
      entidad privada en 1977 bajo el criterio estricto de SOC.
    requisito_entrada: >-
      Informe oficial del Tribunal de Cuentas o del INI que desglose asunción de pasivos privados
      frente a pérdidas operativas de empresa estatal preexistente.
  - pista: Real Decreto-ley 24/1977, de 1 de abril, sobre libertad de expresión
    motivo_descarte: >-
      Norma mixta: suprimió la suspensión administrativa del art. 69 de la Ley de Prensa de 1966,
      pero mantuvo en su art. 3.B el secuestro administrativo para supuestos tasados (unidad de
      España, Monarquía y Fuerzas Armadas). No encaja sin matiz como contraprueba plena ni como
      retroceso respecto a la legislación previa.
    requisito_entrada: >-
      Análisis comparado de resoluciones judiciales o administrativas concretas de aplicación del
      art. 3.B en 1977.
  - pista: Pactos de la Moncloa (octubre de 1977)
    motivo_descarte: >-
      Falta descargar y verificar el Diario de Sesiones del Congreso del 27 de octubre de 1977 con
      el resultado exacto de la votación y la literalidad de los compromisos.
    requisito_entrada: >-
      Descarga del PDF oficial del Diario de Sesiones correspondiente en congreso.es con cálculo
      de sha256.
  - pista: Clasificación de 199 indultos individuales publicados en el BOE durante 1977
    motivo_descarte: >-
      Se localizaron los 199 reales decretos en los 313 boletines de 1977, pero los XML del BOE de
      1977 no incluyen el cuerpo textual del delito (solo imagen PDF escaneada).
    requisito_entrada: >-
      Revisión u OCR de los 199 PDF del BOE de 1977 para clasificar con certeza cuántos
      corresponden a delitos de corrupción según la tipología del CGPJ.
cobertura:
  notas: >-
    Cobertura inicial del año 1977 centrada en arquitectura electoral (DEC), financiación y
    fiscalización de partidos (FIN), amnistía y consenso parlamentario (VOT, GRA), continuidad
    judicial tras supresión del TOP (CTL) y dos contrapruebas verificadas (reforma fiscal y
    garantía judicial de inscripción de partidos).
  huecos:
    - "COR, PRM, PGI, SOC, LMD, LEN, CRI, SOB, DET sin fichas en esta primera entrega (año preconstitucional y falta de series o causas primarias digitalizadas)."
    - "indultos_corrupcion.csv pendiente para 1977 hasta revisar los 199 PDF escaneados de indultos del BOE."
    - "paro_epa.csv y deuda_publica_pib.csv pendientes de enlace directo a tabla oficial homogénea de INE y Banco de España para 1977."
  documentos_manuales:
    - "https://www.congreso.es/public_oficiales/L0/CONG/DS/ (sesión del 27 de octubre de 1977 sobre los Pactos de la Moncloa)"
    - "199 PDFs de Reales Decretos de indulto en boe.es (1977) para clasificar delitos CGPJ"
    - "Serie histórica homogénea EPA 1977 en ine.es y serie PDE en bde.es"
