contexto_resumen: >-
  El 5 de enero de 1977 se publicó en el BOE la Ley 1/1977 para la Reforma Política. El 15 de junio
  se celebraron las primeras elecciones generales democráticas desde 1936, configurando un Congreso
  de 350 escaños encabezado por UCD (165), PSOE (103), AP (16), PSC-PSOE (15), PCE (12), PDC (11),
  PSUC (8), PNV (8) y PSP-US (6), según actas compiladas por la Junta Electoral Central. Adolfo
  Suárez formó nuevo Gobierno en minoría mediante Real Decreto 1563/1977, de 4 de julio (publicado
  en el BOE el 5 de julio). Las Cortes Constituyentes se constituyeron en julio y aprobaron la Ley
  46/1977 de Amnistía y la Ley 50/1977 de reforma fiscal. La moneda de curso fue la peseta.
nota_exposicion: >-
  Durante todo 1977 el Poder Ejecutivo recayó en Adolfo Suárez (hasta el 4 de julio en gobierno de
  transición pre-Cortes y desde el 5 de julio con UCD en minoría). Por efecto de exposición, los 44
  reales decretos-ley de 1977 se desagregan en dos tramos: 38 dictados por el gobierno de transición
  antes de constituirse las Cortes el 13 de julio y 6 dictados por el Gobierno de UCD tras esa
  fecha. Las fuerzas parlamentarias de oposición y ámbito territorial se examinan con idéntico
  criterio en votaciones del Congreso y en la fiscalización de cuentas electorales realizada por la
  Junta Electoral Central.
