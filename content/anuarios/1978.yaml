contexto_resumen: >-
  Durante 1978 gobernó Adolfo Suárez (UCD) en minoría parlamentaria con la composición salida de las
  elecciones de junio de 1977 (350 diputados). El Ejecutivo aprobó 49 reales decretos-ley, incluidos
  regímenes preautonómicos y normas de orden público, mientras las Cortes aprobaron 62 leyes: la
  Constitución Española (aprobada en el Congreso el 31 de octubre por 325 votos a favor, 6 en contra
  y 14 abstenciones, ratificada en referéndum el 6 de diciembre con 15.706.078 votos afirmativos
  sobre 17.873.301 votantes), la Ley 39/1978 de Elecciones Locales, la Ley 48/1978 de Secretos
  Oficiales, la Ley 54/1978 de Partidos Políticos y créditos extraordinarios de rescate industrial.
nota_exposicion: >-
  Todo el año 1978 correspondió al segundo Gobierno de Adolfo Suárez (UCD) en minoría. Por efecto
  de exposición, los 49 reales decretos-ley publicados en el BOE y la dirección de los cuerpos de
  orden público corresponden al Ejecutivo de UCD; las leyes estructurales aprobadas por consenso
  parlamentario (Constitución, elecciones locales, partidos, secretos oficiales y rescates
  industriales) se atribuyen al marco institucional de las Cortes salvo cuando consta votación
  nominal en el Diario de Sesiones.
