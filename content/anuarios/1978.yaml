descartes:
  - pista: Catástrofe del camping de Los Alfaques (11 de julio de 1978, Alcanar)
    motivo_descarte: >-
      Falta localizar y descargar la sentencia firme de la Audiencia Provincial de Tarragona (1982)
      y el Diario de Sesiones del Congreso con la respuesta gubernamental sobre inspección de
      cisternas de propileno.
    requisito_entrada: >-
      Descarga con sha256 de la sentencia judicial firme o del Diario de Sesiones oficial del
      Congreso correspondiente a julio de 1978.
  - pista: Intervención del Banco de Navarra y creación de Corporación Bancaria S.A. (enero–marzo 1978)
    motivo_descarte: >-
      Aunque el RDL 5/1978 (BOE-A-1978-6472) habilitó la intervención cautelar de bancos por el
      Banco de España, la cifra consolidada del coste público del rescate de Banco de Navarra y
      Corporación Bancaria exige citar el informe oficial del Banco de España o de la Comisión
      Parlamentaria de la crisis bancaria.
    requisito_entrada: >-
      Descarga del informe oficial del Banco de España (Memoria Anual 1978 o informe sobre la crisis
      bancaria 1977–1985) con detalle contable del Banco de Navarra.
  - pista: Ley 59/1978 (9.800 millones para Astilleros Españoles y ASTANO) y Ley 36/1978 (8.309 millones para Hunosa)
    motivo_descarte: >-
      Ambas operaciones corresponden a empresas ya integradas en el INI; se priorizó la Ley 60/1978
      (compra de capital y crédito a las privadas Altos Hornos del Mediterráneo y Altos Hornos de
      Vizcaya) y la Ley 21/1978 (aval y seguro de cambio a concesionaria privada de autopista) bajo
      el criterio estricto de SOC.
    requisito_entrada: >-
      Desglose del Tribunal de Cuentas sobre pasivos privados asumidos en la integración previa de
      ASTANO y Astilleros Españoles.
  - pista: Clasificación de 200 indultos individuales publicados en el BOE durante 1978
    motivo_descarte: >-
      Localizados los 200 reales decretos en los 312 boletines de 1978, pero los XML históricos del
      BOE no incluyen el texto del delito (solo imagen PDF escaneada).
    requisito_entrada: >-
      Revisión u OCR de los 200 PDF del BOE de 1978 para clasificar delitos de corrupción según la
      tipología del CGPJ.
cobertura:
  notas: >-
    Cobertura ampliada de 1978 en 8 categorías (FIN, LMD, DEC, SOC, CTL, CRI, VOT y PGI), con
    facsímiles PNG verificados del BOE y del Diario de Sesiones en los 12 registros, 3 contrapruebas
    documentadas y conteo íntegro de 49 reales decretos-ley en 365 días de BOE.
  huecos:
    - "COR, PRM, GRA, LEN, SOB y DET sin fichas en esta primera entrega de 1978."
    - "indultos_corrupcion.csv pendiente para 1978 hasta clasificar los 200 PDF de indultos."
    - "paro_epa.csv y deuda_publica_pib.csv pendientes de descarga directa de tablas históricas homogéneas de INE y Banco de España."
  documentos_manuales:
    - "Sentencia de la Audiencia Provincial de Tarragona (1982) sobre Los Alfaques"
    - "Memoria Anual 1978 del Banco de España (intervención Banco de Navarra y Corporación Bancaria)"
    - "Diarios de Sesiones de las votaciones de Ley 39/1978, Ley 48/1978 y Ley 54/1978 para atribuir voto nominal por partido"
