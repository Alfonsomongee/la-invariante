descartes:
  - pista: Incendio del Hotel Corona de Aragón (Zaragoza, 12 de julio de 1979)
    motivo_descarte: >-
      Falta localizar y descargar con sha256 las sentencias firmes del Tribunal Supremo (contencioso-
      administrativo y penal) y el Diario de Sesiones del Congreso con las explicaciones oficiales
      sobre las causas del incendio.
    requisito_entrada: >-
      Descarga directa de la sentencia del Tribunal Supremo (CENDOJ) o del Diario de Sesiones de la
      I Legislatura relativo al siniestro.
  - pista: Crisis bancaria de 1979 y saneamientos de Corporación Bancaria S.A.
    motivo_descarte: >-
      Pendiente de descarga directa de la Memoria Anual 1979 del Banco de España o de las actas de
      la Comisión parlamentaria con cifras oficiales de pérdidas asumidas por entidad intervenida.
    requisito_entrada: >-
      Informe oficial del Banco de España o del Tribunal de Cuentas con el detalle contable por
      banco en 1979.
  - pista: Clasificación de 167 indultos individuales publicados en el BOE durante 1979
    motivo_descarte: >-
      Se contabilizaron 167 reales decretos de indulto en los 313 boletines de 1979, pero los XML
      históricos del BOE carecen del cuerpo textual del delito (solo imagen PDF).
    requisito_entrada: >-
      Revisión u OCR de los 167 PDF del BOE de 1979 para separar delitos de corrupción según la
      tipología del CGPJ.
cobertura:
  notas: >-
    Cobertura de 1979 en 7 categorías (FIN, SOC, SOB, DEC, CTL, LMD y VOT), inaugurando SOB en el
    archivo, con 13 facsímiles PNG oficiales verificados del BOE y del Congreso, 2 contrapruebas y
    recuento íntegro de los 19 reales decretos-ley (7 Suárez II y 12 Suárez III) en 365 días de BOE.
  huecos:
    - "COR, PRM, GRA, PGI, LEN, CRI y DET sin fichas en esta primera entrega de 1979."
    - "indultos_corrupcion.csv pendiente para 1979 hasta clasificar los 167 PDF de indultos."
    - "paro_epa.csv y deuda_publica_pib.csv pendientes de descarga directa de tablas homogéneas de INE y Banco de España."
  documentos_manuales:
    - "Sentencia del Tribunal Supremo sobre el incendio del Hotel Corona de Aragón (CENDOJ)"
    - "Memoria Anual 1979 del Banco de España (crisis bancaria y Corporación Bancaria)"
    - "Diarios de Sesiones de la votación de los Acuerdos con la Santa Sede y la Ley Orgánica 2/1979"
