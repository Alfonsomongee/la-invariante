contexto_resumen: >-
  Primer ejercicio completo bajo la Constitución de 1978. Tras las elecciones generales del 1 de
  marzo (UCD 168 escaños, PSOE 121, PCE 23), Adolfo Suárez fue investido el 30 de marzo por 183
  votos a favor sin debate parlamentario previo, y el 3 de abril se celebraron las primeras
  elecciones municipales democráticas. El Ejecutivo dictó 19 reales decretos-ley (7 Suárez II y 12
  Suárez III) y las Cortes aprobaron 4 leyes orgánicas (Penitenciaria, Tribunal Constitucional y
  Estatutos del País Vasco y Cataluña) y 42 leyes ordinarias, además de ratificar el Convenio
  Europeo de Derechos Humanos y los Acuerdos con la Santa Sede de 3 de enero de 1979.
nota_exposicion: >-
  Durante todo 1979 gobernó UCD (Suárez II hasta abril y Suárez III después) en minoría con apoyos
  puntuales. Los 19 reales decretos-ley, los 16 reales decretos de aval estatal en divisas a
  concesionarias privadas de autopistas y la resolución de investidura sin debate corresponden a la
  acción del Ejecutivo y la mayoría parlamentaria de UCD; las leyes de créditos extraordinarios,
  leyes orgánicas y ratificaciones de tratados sin votación nominal publicada en esta entrega se
  atribuyen al marco institucional de las Cortes Generales.
