titulo: Sanciones de la Junta Electoral Central por cuentas de la campaña de 1977
resumen: >-
  La Junta Electoral Central sancionó administrativamente en julio de 1978 (BOE núm. 170) por
  irregularidades en las cuentas de las elecciones de 1977 a los partidos no exentos ni sobreseídos,
  incluidos UCD, AP, PSOE, PCE y PNV, tras devolver el Fiscal del Reino los expedientes sin delito.
descargo: >-
  El Fiscal del Reino devolvió los expedientes al no apreciar hechos de naturaleza delictiva. La
  Junta no encontró irregularidades en ocho partidos (entre ellos PDC, PSUC y UDC-CD) y sobreseyó
  los expedientes del Partido Agrario Español y del Equipo de la Democracia Cristiana tras
  subsanarse las deficiencias iniciales.
