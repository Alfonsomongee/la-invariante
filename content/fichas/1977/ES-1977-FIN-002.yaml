    titulo_documento: Resolución de la Junta Electoral Central de 13 de julio de 1978 sobre rendiciones de cuentas electorales de 1977 (BOE núm. 170, de 18 de julio de 1978)
    url: https://www.boe.es/diario_boe/xml.php?id=BOE-A-1978-18445
    sha256: 7b4fde6b47687f2fff695a3abd1331400e7cf68769d65ed05f8d84e5c41ca9dc
    capturado: "2026-11-25"
    pagina: 17001
    fragmento: >-
      Resolución de la Junta Electoral Central por la que se hacen públicas las rendiciones de
      cuentas de gastos originados a las distintas Entidades políticas por la presentación de
      candidaturas y propaganda electoral [BOE núm. 170, de 18 de julio de 1978, fecha de
      disposición 13 de julio de 1978, pág. 17001; texto íntegro en el facsímil PDF oficial].
  - tipo: oficial
    subtipo: resolucion_administrativa
    titulo_documento: Facsímil oficial del BOE núm. 170 (18 de julio de 1978) alojado por la Junta Electoral Central
    url: https://www.juntaelectoralcentral.es/cs/jec/documentos/GENERALES_1977_Fiscalizacion.pdf
    sha256: b0ab89c5afded578d3993e9889ccb2476b8ceca44345df019cc1a59faca86142
    capturado: "2026-11-25"
    pagina: 1
    fragmento: >-
      Segundo.—La cuantía de los fondos recaudados por cada Entidad política es la siguiente
      [pesetas]: [...] Alianza Popular [AP] 538.135.016,83 [...] Pacte Democratic per Catalunya
      53.769.738,00 [...] Partido Comunista de España [PCE] 108.174.936,00; Partido Nacionalista
      Vasco [PNV] 33.880.008,22 [...] Partido Socialista Obrero Español [PSOE] 297.943.584,00 [...]
      Partido Socialista Popular 27.061.000,00 [...] Socialistes de Catalunya (PSC-PSOE)
      40.592.887,00; Unión de Centro Democrático [UCD] 682.920.422,00 [...]. Cuarto.—Por lo que se
      refiere al juicio de la Junta sobre dichas cuentas, la Junta no encuentra irregularidades en
      la contabilidad de los siguientes Partidos: Democracia Cristiana Aragonesa, Lliga de
      Catalunya-Partit Liberal Català, Pacte Democratic per Catalunya, Partido Popular Canario,
      Partido Socialista Galego, Partido Socialista Unificat de Catalunya, Partido Socialista Vasco,
      Unió del Centre i la Democracia Cristiana de Catalunya. En relación con las demás Entidades
      políticas, la Junta sometió en su momento al excelentísimo señor Fiscal del Reino las
      irregularidades observadas, habiendo sido devueltos los expedientes por éste con la
      manifestación de que «no apareciendo, por ahora, la existencia de hechos de naturaleza
      delictiva, es prudente la devolución de la misma a la expresada Junta Electoral Central, a los
      efectos que estime procedente»; en vista de ello se han instruido por la Junta los pertinentes
      expedientes sancionadores ante la posibilidad de que existieran infracciones administrativas
      de las previstas en el artículo 93 del Real Decreto-ley sobre Normas Electorales. Estos
      expedientes han sido sobreseídos por haberse subsanado las irregularidades inicialmente
      observadas en el caso de las siguientes Entidades políticas: Partido Agrario Español, Equipo
      de la Democracia Cristiana. En los demás casos, la Junta ha impuesto las sanciones
      correspondientes a tenor del mencionado artículo 93 del Real Decreto-ley sobre Normas
      Electorales.
