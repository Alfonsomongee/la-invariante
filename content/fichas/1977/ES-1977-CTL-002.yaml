    fragmento: >-
      Ley 50/1977, de 14 de noviembre, sobre medidas urgentes de reforma fiscal [BOE núm. 274, 16
      de noviembre de 1977]. De conformidad con la Ley aprobada por las Cortes, vengo en sancionar.
      [...] Artículo treinta y cinco [35]. [...] Cometerá delito fiscal el que defraude a la
      Hacienda estatal o local [...] en una cantidad igual o superior a dos millones de pesetas
      [2.000.000]. [...] Artículo cuarenta y uno [41]. Quedan plenamente sujetos al deber de
      colaboración [...] los Bancos, Cajas de Ahorros, Cooperativas de Crédito [...] sin que puedan
      exonerarse [...]. Artículo cuarenta y tres [43]. [...] estarán obligadas a comunicar a la
      Administración Tributaria [...] los números de las cuentas activas y pasivas y de los
      depósitos de valores mobiliarios de sus clientes.
