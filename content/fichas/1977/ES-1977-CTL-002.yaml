id: ES-1977-CTL-002
anuario: 1977
categoria: CTL
contraprueba: true
contraprueba_motivo: >-
  Reforma aprobada por las Cortes Constituyentes que amplió la capacidad de control público y redujo
  la opacidad patrimonial al tipificar el delito fiscal e imponer a las entidades bancarias el deber
  de colaboración tributaria sin poder ampararse en el secreto bancario.
partidos:
  - institucional
nivel: estatal
ambito_territorial: España
protagonistas: []
estado_procesal:
  actual: no_judicial
  historial: []
titulo: Ley 50/1977 de reforma fiscal, creación del delito fiscal y fin del secreto bancario
resumen: >-
  Las Cortes aprobaron la Ley 50/1977, de 14 de noviembre (BOE del 16 de noviembre), que tipificó
  el delito fiscal desde 2.000.000 de pesetas (12.020,24 euros) en el artículo 35 y obligó a bancos
  y cajas a colaborar con la Administración Tributaria (artículos 41 y 43).
descargo: >-
  La ley incorporó una regularización voluntaria sin sanción (artículo 30), reservó la persecución
  del delito fiscal a instancia de la Administración tras firmeza administrativa o resolución del
  Tribunal Económico-Administrativo Central (artículo 37) y exigió autorización administrativa
  previa para investigar cuentas concretas (artículo 42).
