  intento_de_refutacion: >-
    Se incorporaron las dos cautelas clave del articulado: el filtro de procedibilidad del art. 37
    (persecución solo a instancia administrativa tras firmeza o resolución del TEAC) y la
    autorización administrativa previa del art. 42, además de corregir la atribución partidista a
    institucional al carecer de DSCD de la votación en fuentes. Pese a esos límites, la ley creó el
    delito fiscal y levantó el secreto bancario frente a Hacienda.
