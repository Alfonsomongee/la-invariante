titulo: Ley 46/1977 de Amnistía y extinción de delitos de autoridades y agentes
resumen: >-
  Las Cortes aprobaron la Ley 46/1977, de 15 de octubre (BOE del 17 de octubre), que extinguió la
  responsabilidad penal por actos de intencionalidad política y comprendió en su artículo 2 los
  delitos cometidos por autoridades, funcionarios y agentes del orden público en su persecución o
  contra derechos de las personas.
descargo: >-
  Los grupos impulsores en el Congreso defendieron la amnistía mutua como instrumento para liberar
  a los presos políticos, permitir el regreso de exiliados y consolidar el tránsito a la democracia
  (Diario de Sesiones núm. 24, 14 de octubre de 1977).
