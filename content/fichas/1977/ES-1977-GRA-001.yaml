    fragmento: >-
      Ley 46/1977, de 15 de octubre, de Amnistía [BOE núm. 248, 17 de octubre de 1977]. Artículo
      primero. I. Quedan amnistiados: a) Todos los actos de intencionalidad política, cualquiera
      que fuese su resultado, tipificados como delitos y faltas realizados con anterioridad al día
      quince de diciembre de mil novecientos setenta y seis. [...] Artículo segundo [2]. En todo
      caso están comprendidos en la amnistía: [...] e) Los delitos y faltas que pudieran haber
      cometido las autoridades, funcionarios y agentes del orden público, con motivo u ocasión de
      la investigación y persecución de los actos incluidos en esta Ley. f) Los delitos cometidos
      por los funcionarios y agentes del orden público contra el ejercicio de los derechos de las
      personas. [...] Artículo sexto. La amnistía determinará en general la extinción de la
      responsabilidad criminal.
