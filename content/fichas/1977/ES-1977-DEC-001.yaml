titulo: Real Decreto-ley 20/1977 de listas cerradas y circunscripción provincial
resumen: >-
  El Gobierno de Adolfo Suárez aprobó el Real Decreto-ley 20/1977, de 18 de marzo (BOE del 23 de
  marzo), que fijó la provincia como distrito electoral (artículo 19), las listas cerradas y
  bloqueadas sin modificación de orden (artículo 20.3) y la barrera del 3 % (artículo 20.4.b) en el
  Congreso.
descargo: >-
  El Gobierno dictó la norma al amparo de la Disposición Transitoria Primera de la Ley 1/1977 para
  la Reforma Política, aprobada en referéndum el 15 de diciembre de 1976, para regular con carácter
  provisional las elecciones generales del 15 de junio de 1977 antes de constituirse las Cortes.
