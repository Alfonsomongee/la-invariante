    fragmento: >-
      Real Decreto-ley 20/1977, de 18 de marzo, sobre Normas Electorales [BOE núm. 70, 23 de marzo
      de 1977]. [...] Artículo diecinueve [19]. Uno. Para la elección de Diputados y de Senadores
      cada provincia y las ciudades de Ceuta y Melilla constituirán un distrito electoral. [...]
      Artículo veinte [20.3]. Tres. Cada uno de los electores de un distrito sólo podrá dar su voto
      a una sola lista, sin introducir en ella modificación alguna ni alterar en la misma el orden
      de colocación de los candidatos. Cuatro [20.4.b]. b) No serán tenidas en cuenta aquellas
      listas que no hubiesen obtenido, por lo menos, el tres por ciento [3 %] de los votos válidos
      emitidos en el distrito. [...] El Presidente del Gobierno, Adolfo Suárez González.
