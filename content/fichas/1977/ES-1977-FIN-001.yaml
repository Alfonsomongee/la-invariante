    fragmento: >-
      Real Decreto-ley 20/1977 [BOE núm. 70, 23 de marzo de 1977]. [...] Artículo cuarenta y cuatro
      [44]. Uno. El Estado subvencionará los gastos que originen las actividades electorales, de
      acuerdo con las siguientes reglas: a) Un millón de pesetas [1.000.000] por cada escaño
      obtenido en el Congreso o en el Senado. b) Cuarenta y cinco [45] pesetas por cada uno de los
      votos obtenidos por cada candidatura al Congreso, uno de cuyos miembros, al menos, hubiera
      obtenido escaño de Diputado. c) Quince [15] pesetas por cada uno de los votos obtenidos por
      cada candidato que hubiera obtenido escaño de Senador.
