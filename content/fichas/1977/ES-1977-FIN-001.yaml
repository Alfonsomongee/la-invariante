titulo: Subvenciones estatales a partidos por escaño y voto en el Real Decreto-ley 20/1977
resumen: >-
  El artículo 44 del Real Decreto-ley 20/1977, publicado en el BOE el 23 de marzo de 1977, fijó
  subvenciones estatales electorales de 1.000.000 de pesetas (6.010,12 euros) por escaño, 45 pesetas
  por voto a candidaturas al Congreso con escaño y 15 pesetas por voto a senadores electos.
descargo: >-
  La exposición normativa justificó las subvenciones estatales para sufragar los gastos de
  campaña en la transición a un sistema pluripartidista, acompañadas de la obligación de rendir
  cuentas ante la Junta Electoral Central (artículo 48).
