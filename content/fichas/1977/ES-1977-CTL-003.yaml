    fragmento: >-
      Real Decreto-ley 12/1977, de 8 de febrero, sobre el derecho de asociación política [BOE núm.
      35, 10 de febrero de 1977]. [...] Artículo primero. Uno. [...] En el plazo máximo de diez
      días [10], el Ministerio de la Gobernación procederá a la inscripción de la Asociación en
      dicho Registro. Dos. Ello, no obstante, si se presume la ilicitud penal de la Asociación, el
      Ministerio de la Gobernación, dentro del mismo plazo y con suspensión de la inscripción,
      remitirá la documentación presentada a la Sala del Tribunal Supremo [...]. Artículo tercero.
      Las sanciones previstas en el apartado cinco del artículo seis de la Ley veintiuno/mil
      novecientos setenta y seis, de catorce de junio [Ley 21/1976], solo podrán imponerse por
      resolución judicial de la Sala del Tribunal Supremo [...].
