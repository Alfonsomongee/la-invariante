  intento_de_refutacion: >-
    Se verificó si el Ministerio de la Gobernación mantuvo margen de bloqueo: el artículo 1.2
    permitía suspender y elevar al Tribunal Supremo, pero la decisión sobre la inscripción y las
    sanciones del art. 6.5 de la Ley 21/1976 pasaron a exigir resolución judicial. Se eliminó del
    descargo toda referencia histórica ajena al texto del BOE-A-1977-3663.
