id: ES-1977-CTL-003
anuario: 1977
categoria: CTL
contraprueba: true
contraprueba_motivo: >-
  Reforma que redujo la discrecionalidad gubernativa al sustituir la autorización política previa de
  partidos por un trámite reglado de diez días y trasladar al Tribunal Supremo la decisión sobre
  ilicitud penal y sanciones a asociaciones políticas.
partidos:
  - institucional
nivel: estatal
ambito_territorial: España
protagonistas:
  - nombre: Adolfo Suárez González
    cargo_en_el_momento: Presidente del Gobierno
    cargo_publico: true
estado_procesal:
  actual: no_judicial
  historial: []
titulo: Real Decreto-ley 12/1977 de garantía judicial para la inscripción de partidos políticos
resumen: >-
  El Gobierno aprobó el Real Decreto-ley 12/1977, de 8 de febrero (BOE del 10 de febrero), que fijó
  un plazo máximo de 10 días para inscribir asociaciones políticas y reservó a una Sala del Tribunal
  Supremo la denegación por ilicitud penal y las sanciones de la Ley 21/1976.
descargo: >-
  El Ministerio de la Gobernación conservó la facultad de suspender la inscripción durante ese plazo
  y remitir la documentación al Tribunal Supremo mediante acuerdo motivado si presumía ilicitud
  penal de la asociación (artículo 1.2), quedando la resolución judicial fijada en un plazo de
  treinta días (artículo 1.3).
