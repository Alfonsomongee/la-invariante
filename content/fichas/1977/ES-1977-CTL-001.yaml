titulo: Adscripción y preferencia de destino en Madrid para magistrados del suprimido TOP
resumen: >-
  El Real Decreto-ley 2/1977, de 4 de enero (BOE del 5 de enero), suprimió el Tribunal de Orden
  Público y dispuso en sus Disposiciones Transitorias la adscripción de sus magistrados y fiscales
  a la Audiencia Territorial y Juzgados de Madrid sin merma retributiva y con preferencia en
  concursos de destino.
descargo: >-
  Los artículos 1 y 2 suprimieron el tribunal político franquista y devolvieron sus competencias a
  la jurisdicción ordinaria penal; la Disposición Transitoria Segunda estableció que la preferencia
  regiría una sola vez y sin perjudicar la antigüedad de jueces ya destinados en Madrid.
