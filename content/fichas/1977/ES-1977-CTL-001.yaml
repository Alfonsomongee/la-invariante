  intento_de_refutacion: >-
    El Verificador señaló que la norma suprime el TOP y amortiza cinco plazas de magistrados en su
    Disposición Adicional, mientras la adscripción se dirige a órganos judiciales ordinarios de
    Madrid y no a un órgano de control autónomo en sentido estricto. Queda marcada en revisión
    humana para decidir si mantenerla en CTL por continuidad del personal judicial o descartarla.
