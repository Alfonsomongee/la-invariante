    fragmento: >-
      Real Decreto-ley 2/1977, de 4 de enero [BOE núm. 4, 5 de enero de 1977]. Artículo primero. Se
      suprimen el Tribunal y los Juzgados de Orden Público [TOP]. [...] Disposiciones Transitorias.
      Primera. El Presidente y los Magistrados del suprimido Tribunal de Orden Público quedarán
      adscritos, con carácter provisional, a las Salas o Secciones de la Audiencia Territorial de
      Madrid. Segunda. [...] En los referidos concursos gozarán de preferencia, por una sola vez.
      Tercera. Los Fiscales adscritos al Tribunal de Orden Público se incorporarán a la Fiscalía de
      la Audiencia Territorial de Madrid. [...] Quinta. La adscripción provisional se hará sin
      menoscabo alguno de los derechos económicos.
