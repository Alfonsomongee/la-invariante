titulo: Créditos extraordinarios de 5.109 millones a partidos financiados por el Banco de España
resumen: >-
  Las Cortes aprobaron las Leyes 12/1979 y 14/1979 (BOE del 6 de octubre de 1979), que concedieron
  en un mismo boletín 1.651.585.520 pesetas para gastos ordinarios de partidos de 1978 y
  3.458.000.000 de pesetas para subvenciones electorales generales y locales, financiados ambos
  con anticipos del Banco de España al Tesoro Público.
descargo: >-
  Ambas leyes ejecutaron los pagos previstos legalmente en el Real Decreto-ley 20/1977 de normas
  electorales, la Ley 39/1978 de elecciones locales y el artículo 6 de la Ley 54/1978 de Partidos
  Políticos, al carecer de dotación específica en los Presupuestos vigentes.
