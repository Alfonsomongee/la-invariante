  intento_de_refutacion: >-
    Se verificó que la Constitución de 1978 solo preveía el aforamiento estatal de diputados,
    senadores y miembros del Gobierno (arts. 71 y 102 CE), sin imponerlo a las Comunidades
    Autónomas; los Estatutos de 1979 inauguraron la extensión del fuero especial penal a cargos
    autonómicos, recogiendo en descargo la ratificación referendaria y la ausencia de suplicatorio.
