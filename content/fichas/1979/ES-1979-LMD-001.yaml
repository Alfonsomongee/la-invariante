titulo: Extensión de aforamientos penales e inmunidad a parlamentos y ejecutivos autonómicos
resumen: >-
  Los dos primeros Estatutos de Autonomía (Leyes Orgánicas 3/1979 del País Vasco y 4/1979 de
  Cataluña, BOE del 22 de diciembre) extendieron el fuero penal especial al nivel autonómico:
  parlamentarios vascos (artículo 26.6), Gobierno Vasco (artículo 32.2) y diputados catalanes
  (artículo 31.2) solo responden ante el Tribunal Superior de Justicia o el Supremo.
descargo: >-
  Ambos Estatutos fueron ratificados en referéndum autonómico el 25 de octubre de 1979 (831.839
  votos afirmativos en País Vasco y 2.327.038 en Cataluña), no impusieron suplicatorio previo de la
  cámara autonómica para procesar a diputados y mantuvieron la detención en delito descubierto en el
  acto.
