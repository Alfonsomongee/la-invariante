    fragmento: >-
      Ley Orgánica 3/1979, de 18 de diciembre, de Estatuto de Autonomía para el País Vasco [BOE
      núm. 306, 22 de diciembre de 1979]. Artículo 26. 6 [26.6]. Los miembros del Parlamento Vasco
      serán inviolables [...]. Durante su mandato [...] correspondiendo decidir, en todo caso,
      sobre su inculpación, prisión, procesamiento y juicio al Tribunal Superior de Justicia del
      País Vasco. Fuera del ámbito territorial del País Vasco, la responsabilidad penal será
      exigible [...] ante la Sala de lo Penal del Tribunal Supremo. Artículo 32. 2 [32.2]. El
      Presidente del Gobierno y sus miembros [Gobierno Vasco] [...] ante el Tribunal Superior de
      Justicia del País Vasco [...] Tribunal Supremo.
