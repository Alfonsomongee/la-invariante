    fragmento: >-
      Ley Orgánica 1/1979, de 26 de septiembre, General Penitenciaria [BOE núm. 239, 5 de octubre
      de 1979]. [...] Artículo sexto [6]. Ningún interno será sometido a malos tratos de palabra u
      obra. [...] Artículo setenta y seis [76]. Uno. El Juez de Vigilancia tendrá atribuciones para
      hacer cumplir la pena impuesta, resolver los recursos [...], salvaguardar los derechos de los
      internos y corregir los abusos y desviaciones que en el cumplimiento de los preceptos del
      régimen penitenciario puedan producirse. Dos. [...] d) Aprobar las sanciones de aislamiento
      en celda de duración superior a catorce días. e) Resolver por vía de recurso las
      reclamaciones que formulen los internos sobre sanciones disciplinarias.
