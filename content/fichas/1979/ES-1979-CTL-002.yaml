id: ES-1979-CTL-002
anuario: 1979
categoria: CTL
contraprueba: true
contraprueba_motivo: >-
  Primera Ley Orgánica de la democracia española: prohibió los malos tratos en prisión y creó el
  Juez de Vigilancia Penitenciaria para someter la ejecución de penas y las sanciones internas a
  control judicial independiente.
partidos:
  - institucional
nivel: estatal
ambito_territorial: España
protagonistas: []
estado_procesal:
  actual: no_judicial
  historial: []
titulo: Creación del Juez de Vigilancia Penitenciaria y prohibición de malos tratos (LO 1/1979)
resumen: >-
  Las Cortes aprobaron la Ley Orgánica 1/1979, de 26 de septiembre (BOE del 5 de octubre), General
  Penitenciaria, que prohibió someter a ningún interno a malos tratos de palabra u obra (artículo
  6) y creó el Juez de Vigilancia (artículo 76) para salvaguardar derechos, resolver recursos
  disciplinarios y corregir abusos penitenciarios.
descargo: >-
  La Disposición Final Primera permitió a los Ministerios de Justicia e Interior suspender
  parcial y temporalmente derechos de internos en caso de alteraciones graves del orden en un
  centro que obligasen a requerir la intervención de los Cuerpos de Seguridad del Estado, dando
  cuenta inmediata a la Comisión de Justicia del Congreso.
