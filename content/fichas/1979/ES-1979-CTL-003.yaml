id: ES-1979-CTL-003
anuario: 1979
categoria: CTL
contraprueba: true
contraprueba_motivo: >-
  España ratificó el Convenio Europeo de Derechos Humanos y reconoció la jurisdicción obligatoria
  del Tribunal Europeo de Derechos Humanos (artículo 46), sometiendo al Estado a control jurídico
  externo en derechos fundamentales.
partidos:
  - institucional
nivel: estatal
ambito_territorial: España
protagonistas: []
estado_procesal:
  actual: no_judicial
  historial: []
titulo: Ratificación del Convenio Europeo de Derechos Humanos y jurisdicción obligatoria del TEDH
resumen: >-
  España publicó el 10 de octubre de 1979 el Instrumento de Ratificación del Convenio Europeo de
  Derechos Humanos de Roma (1950), vigente desde el 4 de octubre de 1979, y reconoció por tres años
  desde el 15 de octubre la jurisdicción obligatoria del Tribunal Europeo de Derechos Humanos en
  virtud del artículo 46.
descargo: >-
  España formuló reservas a los artículos 5 y 6 respecto del régimen disciplinario militar del
  Código de Justicia Militar y al artículo 11 respecto de los artículos 28 y 127 de la
  Constitución, interpretó el artículo 10 compatible con el régimen de radio y televisión y aplazó
  la aceptación de demandas individuales del artículo 25 al desarrollo legislativo posterior.
