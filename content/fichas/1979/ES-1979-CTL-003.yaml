    fragmento: >-
      Instrumento de Ratificación del Convenio para la Protección de los Derechos Humanos y de las
      Libertades Fundamentales [Convenio Europeo de Derechos Humanos], hecho en Roma el 4 de
      noviembre de 1950 [BOE núm. 243, 10 de octubre de 1979]. [...] España declara, de conformidad
      con las disposiciones del artículo 46, que reconoce, por un período de tres años a partir del
      15 de octubre de 1979, como obligatoria de pleno derecho [...] la jurisdicción del Tribunal
      Europeo de Derechos Humanos [...]. El presente Convenio entró en vigor [...] para España el
      4 de octubre de 1979 [...].
