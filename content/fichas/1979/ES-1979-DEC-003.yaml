titulo: Emisión anticipada de 70.000 millones de Deuda y 80.000 del ICO por decreto-ley (RDL 9/1979)
resumen: >-
  Pese a citar la reserva de ley del artículo 135.1 de la Constitución para emitir deuda, el
  Gobierno de Adolfo Suárez aprobó el Real Decreto-ley 9/1979 (BOE del 22 de mayo), anticipando
  antes de aprobarse los Presupuestos de 1979 la autorización de 70.000.000.000 de pesetas en Deuda
  Interior y 80.000.000.000 de pesetas para el Instituto de Crédito Oficial.
descargo: >-
  El artículo 2 limitó la utilización efectiva al 60 por 100 de dichas cuantías hasta la entrada en
  vigor de la Ley de Presupuestos Generales del Estado de 1979 (aprobada en julio) y computó las
  emisiones anticipadas dentro de los topes definitivos aprobados por las Cortes.
