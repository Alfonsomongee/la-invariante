    fragmento: >-
      Real Decreto-ley 9/1979, de 18 de mayo [BOE núm. 122, 22 de mayo de 1979]. El artículo 135.1
      de la Constitución Española dispone que el Gobierno habrá de estar autorizado por Ley para
      emitir Deuda Pública [...]. El Proyecto de Ley de Presupuestos [...] actualmente en las
      Cortes [...] autoriza la emisión de Deuda Interior [...] por un importe de setenta mil
      millones de pesetas [70.000.000.000] [...] y fija dichos recursos [del Instituto de Crédito
      Oficial] en ochenta mil millones de pesetas [80.000.000.000]. Artículo primero. Se anticipa
      [...] la aplicación de los siguientes preceptos [...]. El Presidente del Gobierno, Adolfo
      Suárez González.
