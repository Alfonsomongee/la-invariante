  intento_de_refutacion: >-
    Se verificó la limitación temporal al 60 % del art. 2 y su posterior integración en la Ley
    1/1979 de Presupuestos (recogido en descargo); el RDL 9/1979 ilustra la utilización del
    decreto-ley para anticipar autorizaciones presupuestarias de emisión de deuda pública mientras
    las Cortes debatían la Ley de Presupuestos.
