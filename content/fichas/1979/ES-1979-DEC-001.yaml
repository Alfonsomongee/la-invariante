titulo: Tipos penales, prisión provisional y bloqueo de excarcelaciones por decreto-ley (RDL 3/1979)
resumen: >-
  Con las Cortes disueltas tras promulgarse la Constitución, el Gobierno de Adolfo Suárez dictó el
  Real Decreto-ley 3/1979 (BOE del 1 de febrero), que castigó con prisión menor la apología en
  prensa (artículo 1), amplió la prisión provisional incondicional (artículo 5), bloqueó
  excarcelaciones si recurre el fiscal (artículo 6) y obligó a declarar alquileres a Interior
  (artículo 8).
descargo: >-
  El preámbulo invocó el artículo 86 de la Constitución frente al terrorismo y la delincuencia,
  presentó la norma como provisional hasta aprobar nuevos Código Penal y Ley de Enjuiciamiento
  Criminal y derogó íntegramente el Decreto-ley 10/1975 del régimen anterior.
