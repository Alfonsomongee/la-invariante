    capturado: "2026-11-25"
    pagina: "2636-2637"
    fragmento: >-
      Real Decreto-ley 3/1979, de 26 de enero, sobre protección de la seguridad ciudadana [BOE
      núm. 28, 1 de febrero de 1979]. [...] en uso de la facultad prevista en el artículo 86 de la
      Constitución [...]. Artículo primero [1]. La apología pública, oral o escrita o por medio de
      la imprenta [prensa] [...] será castigada con la pena de prisión menor. [...] Artículo quinto
      [5]. El Juez de Instrucción o Central [...] podrá decretar la prisión provisional
      incondicional, aunque el delito tenga señalada pena inferior a la de presidio o prisión
      mayores. Artículo sexto [6]. [...] No se llevará a cabo la excarcelación de los presos o
      detenidos cuya libertad se hubiese acordado, en tanto la resolución no sea firme, cuando el
      recurrente fuese el Ministerio Fiscal [...]. Artículo octavo [8]. Todas las personas [...] que
      vendan o arrienden viviendas o locales [alquileres] estarán obligadas a facilitar [...] datos
      [...] en la forma que determine el Ministerio del Interior. [...] El Presidente del Gobierno,
      Adolfo Suárez González.
