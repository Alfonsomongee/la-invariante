    Se verificó la naturaleza bilateral del tratado (art. VI) y sus límites internos (exclusión de
    explotaciones económicas en art. IV.1.B, carácter voluntario de la asignatura y objetivo de
    autofinanciación en art. II.5, todos recogidos en descargo); al suscribirse como tratado
    internacional cinco días tras entrar en vigor la Constitución, quedó sustraído a la reforma
    unilateral por ley ordinaria de las Cortes.
