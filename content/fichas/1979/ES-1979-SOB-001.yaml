titulo: Acuerdos con la Santa Sede de 3 de enero de 1979 con rango de tratado internacional
resumen: >-
  Firmados cinco días después de entrar en vigor la Constitución y ratificados como tratados
  internacionales (BOE del 15 de diciembre de 1979), los Acuerdos con la Santa Sede obligaron al
  Estado a dotación presupuestaria y asignación tributaria (artículo II), exenciones permanentes de
  Contribución Territorial Urbana y renta (artículo IV) y religión católica en escuelas públicas.
descargo: >-
  Los acuerdos sustituyeron el Concordato de 1953, declararon en el artículo II.5 el propósito de
  la Iglesia Católica de lograr autofinanciación, excluyeron de la exención fiscal las
  explotaciones económicas y ganancias de capital (artículo IV.1.B) y declararon voluntaria la
  asignatura de religión para el alumnado.
