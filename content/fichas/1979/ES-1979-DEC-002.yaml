    fragmento: >-
      Real Decreto-ley 19/1979, de 23 de noviembre [BOE núm. 289, 3 de diciembre de 1979]. Aunque la
      competencia de la Audiencia Nacional es objeto de especial consideración en el Proyecto de
      Ley Orgánica del Poder Judicial remitido a las Cortes Generales [...]. Artículo primero [1].
      Los apartados a) y c) del párrafo uno del artículo cuarto del Real Decreto-ley 1/1977 [...]
      cuando se cometan utilizando medios de comunicación social [...] así como los de escándalo
      público [...]. Artículo segundo [2]. Se prorroga durante un año la vigencia de la Ley
      56/1978, de 4 de diciembre, de medidas especiales en relación con los delitos de terrorismo
      [...]. El Presidente del Gobierno, Adolfo Suárez González.
