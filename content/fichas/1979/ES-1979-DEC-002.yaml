titulo: Reforma de la Audiencia Nacional y prórroga antiterrorista por decreto-ley (RDL 19/1979)
resumen: >-
  Estando ya en las Cortes el Proyecto de Ley Orgánica del Poder Judicial, el Gobierno de Adolfo
  Suárez aprobó el Real Decreto-ley 19/1979 (BOE del 3 de diciembre), que reformó la competencia
  penal de la Audiencia Nacional incluyendo delitos en medios de comunicación y escándalo público
  (artículo 1) y prorrogó un año la Ley 56/1978 antiterrorista (artículo 2).
descargo: >-
  El preámbulo invocó la extraordinaria y urgente necesidad de evitar que expirase el plazo anual
  de la Ley 56/1978 antes de aprobarse la Ley de Seguridad Ciudadana, y el artículo 3 dispuso el
  cese automático de ambas medidas al entrar en vigor la futura Ley Orgánica del Poder Judicial y
  la ley del artículo 55.2 de la Constitución.
