    fragmento: >-
      Ley 10/1979, de 2 de octubre [BOE núm. 240, 6 de octubre de 1979]. Las Cortes Generales han
      aprobado [...]. Artículo 1. Se concede una subvención, con carácter extraordinario y por una
      sola vez, de dos [2] pesetas a las Empresas periodísticas privadas y a las Asociaciones de
      Prensa [...] por ejemplar [...] vendida durante el segundo semestre de 1978 [...]. La
      Secretaría de Estado para la Información será el Organo competente para resolver los
      expedientes de concesión [...]. Artículo 2. [...] crédito extraordinario, por un importe
      máximo de novecientos millones de pesetas [900.000.000] [...]. Artículo 3. La financiación
      [...] se realizará con anticipos a facilitar por el Banco de España al Tesoro Público.
