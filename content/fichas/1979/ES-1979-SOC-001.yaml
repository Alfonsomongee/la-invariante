titulo: Subvenciones directas de 1.342 millones a empresas periodísticas privadas y papel prensa
resumen: >-
  Las Cortes aprobaron en 1979 dos créditos extraordinarios financiados con anticipos del Banco de
  España para prensa privada: la Ley 10/1979 (BOE del 6 de octubre) destinó 900.000.000 de pesetas
  (2 pesetas por ejemplar) resueltas por la Secretaría de Estado para la Información, y la Ley
  65/1978 (BOE del 3 de enero) asignó 442.616.346 pesetas a papel prensa.
descargo: >-
  El artículo 1 de la Ley 10/1979 justificó la subvención extraordinaria y por una sola vez en
  compensar la falta de ingresos durante el segundo semestre de 1978 al no incrementarse el precio
  de la prensa diaria, y el artículo 2 dispuso anular cualquier sobrante no aplicado.
