    fragmento: >-
      Ley 68/1978, de 26 de diciembre [BOE núm. 3, 3 de enero de 1979]. De conformidad con la Ley
      aprobada por las Cortes, vengo en sancionar. Artículo 1. Se concede un crédito extraordinario
      de mil setecientos veintisiete millones trescientas treinta y tres mil cuatrocientas
      veintitrés pesetas [1.727.333.423] [...] Dirección General del Patrimonio del Estado [...]
      Para la adquisición de acciones de la "Compañía Trasmediterránea, Sociedad Anónima" [S. A.].
      Artículo 2. Los recursos que financiarán el crédito extraordinario procederán de anticipos a
      facilitar por el Banco de España al Tesoro Público.
