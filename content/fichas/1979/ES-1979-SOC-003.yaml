titulo: Crédito extraordinario de 1.727 millones para adquirir acciones de Compañía Trasmediterránea
resumen: >-
  Las Cortes aprobaron la Ley 68/1978, de 26 de diciembre (BOE del 3 de enero de 1979), que
  concedió un crédito extraordinario de 1.727.333.423 pesetas (10.381.482,96 euros) a la Dirección
  General del Patrimonio del Estado para adquirir acciones de la privada «Compañía Trasmediterránea,
  S. A.», financiado mediante anticipos del Banco de España.
descargo: >-
  La operación se articuló como adquisición de activos financieros (capítulo 8 del Presupuesto) por
  la Dirección General del Patrimonio del Estado, pasando la naviera al sector público empresarial
  en el marco de las líneas marítimas de interés nacional.
