titulo: Designación política, prórroga en funciones y legitimación cerrada en la Ley del TC (LO 2/1979)
resumen: >-
  Las Cortes aprobaron la Ley Orgánica 2/1979 (BOE del 5 de octubre), que desarrolló el
  nombramiento de magistrados del Tribunal Constitucional por Cámaras, Gobierno y CGPJ (artículo
  16), fijó su prórroga indefinida hasta toma de posesión de sucesores (artículo 17.2), restringió
  el recurso de inconstitucionalidad a cargos públicos (artículo 32) y creó el recurso previo
  suspensivo (artículo 79).
descargo: >-
  La ley declaró la independencia del Tribunal Constitucional (artículo 1), fijó incompatibilidades
  con cargos directivos de partidos (artículo 19) y habilitó en los artículos 41 a 58 el recurso de
  amparo directo para que cualquier ciudadano defendiera derechos fundamentales vulnerados.
