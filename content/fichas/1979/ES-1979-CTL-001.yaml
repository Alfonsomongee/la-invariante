    fragmento: >-
      Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional [BOE núm. 239, 5 de octubre
      de 1979]. Artículo dieciséis [16]. Uno. Los Magistrados del Tribunal Constitucional serán
      nombrados por el Rey, a propuesta de las Cámaras, del Gobierno y del Consejo General del
      Poder Judicial [CGPJ] [...]. Artículo diecisiete [17.2]. Dos. Los Magistrados del Tribunal
      Constitucional continuarán en el ejercicio de sus funciones hasta que hayan tomado posesión
      quienes hubieren de sucederles. [...] Artículo treinta y dos [32]. Uno. Están legitimados
      para el ejercicio del recurso de inconstitucionalidad [...]: a) El Presidente del Gobierno.
      b) El Defensor del Pueblo. c) Cincuenta Diputados. d) Cincuenta Senadores [y órganos
      autonómicos]. [...] Artículo setenta y nueve [79]. Uno. Son susceptibles de recurso de
      inconstitucionalidad, con carácter previo, los proyectos de Estatuto de Autonomía y de Leyes
      orgánicas. [...] La interposición del recurso suspenderá automáticamente la tramitación [...].
