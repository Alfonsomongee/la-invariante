  intento_de_refutacion: >-
    Se incorporaron en descargo las garantías de independencia (art. 1), incompatibilidades con
    cargos directivos partidistas (art. 19) y la apertura del recurso de amparo individual (arts.
    41-58); la ley consolidó el mecanismo de prórroga indefinida (art. 17.2), la exclusión de
    legitimación ciudadana en el recurso de inconstitucionalidad (art. 32) y el recurso previo con
    efecto suspensivo automático (art. 79).
