titulo: Avales solidarios del Estado en divisas para autopistas privadas y tope de 65.000 millones
resumen: >-
  La Ley 1/1979 de Presupuestos fijó un tope de 65.000.000.000 de pesetas en avales estatales a
  crédito exterior excluyendo refinanciaciones (artículo 20), y el Gobierno autorizó durante 1979
  garantías solidarias en divisas a concesionarias privadas de autopistas como Mare Nostrum
  (3.138.000.000 pesetas), Autopistas de Navarra (1.534.500.000 pesetas) y Autopistas del Atlántico.
descargo: >-
  Los Reales Decretos 1117/1979 y 1118/1979 condicionaron las garantías a cancelar deuda exterior
  previamente avalada para no superar el límite de cada concesión y a la existencia de margen
  presupuestario; el RD 1993/1979 mantuvo el carácter subsidiario respecto de la Diputación Foral
  de Navarra aunque renunció al beneficio de excusión.
