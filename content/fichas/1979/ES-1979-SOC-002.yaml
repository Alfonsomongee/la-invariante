  intento_de_refutacion: >-
    Se verificó la existencia de condiciones de cancelación de avales previos en RD 1117 y 1118
    (recogidas en descargo), pero el art. 20.1 de los PGE excluyó expresamente las refinanciaciones
    del tope anual de 65.000M ptas y el Estado asumió garantía solidaria (y renuncia de excusión en
    Navarra) en 16 decretos de concesionarias privadas durante 1979.
