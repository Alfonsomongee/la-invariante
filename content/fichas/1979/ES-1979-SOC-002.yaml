    fragmento: >-
      Ley 1/1979, de 19 de julio, de Presupuestos Generales del Estado [...]. Artículo veinte [20].
      Uno. El importe total de los avales a prestar por el Estado durante el ejercicio de 1979, por
      razón de operaciones de crédito exterior de cualquier naturaleza, no podrá exceder de sesenta
      y cinco mil millones de pesetas [65.000.000.000]. No se imputará al citado límite el importe
      de los avales que se presten con motivo de la refinanciación o sustitución de operaciones de
      crédito que impliquen cancelación de avales anteriormente concedidos.
