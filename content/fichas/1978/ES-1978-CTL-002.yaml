titulo: Designación política de órganos de control, aforamientos e inviolabilidad en la Constitución
resumen: >-
  La Constitución Española (BOE del 29 de diciembre de 1978) fijó la inviolabilidad del Rey
  (artículo 56.3), el aforamiento ante el Supremo y el suplicatorio parlamentario (artículo 71),
  8 vocales del CGPJ propuestos por las Cortes (artículo 122.3), 12 magistrados del Tribunal
  Constitucional (artículo 159.1) y el Tribunal de Cuentas dependiente de las Cortes (artículo 136).
descargo: >-
  El texto constitucional exigió mayorías cualificadas de tres quintos en las Cámaras para los
  nombramientos del CGPJ y del Tribunal Constitucional, reservó 12 de los 20 vocales del CGPJ entre
  jueces y magistrados y reconoció independencia judicial e inamovilidad en el artículo 117.
