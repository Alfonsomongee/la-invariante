    fragmento: >-
      Constitución Española [BOE núm. 311, 29 de diciembre de 1978]. [...] Artículo 56. 3 [56.3].
      La persona del Rey es inviolable y no está sujeta a responsabilidad. [...] Artículo 71. 2.
      [...] No podrán ser inculpados ni procesados sin la previa autorización de la Cámara
      respectiva [suplicatorio]. 3. En las causas contra Diputados y Senadores será competente la
      Sala de lo Penal del Tribunal Supremo. [...] Artículo 122. 3 [122.3]. El Consejo General del
      Poder Judicial [CGPJ] estará integrado por [...] veinte miembros [...]: doce entre Jueces y
      Magistrados [...] cuatro a propuesta del Congreso [...] y cuatro a propuesta del Senado [8
      vocales] [...]. Artículo 136. 1. El Tribunal de Cuentas [...] Dependerá directamente de las
      Cortes Generales [...]. Artículo 159. 1 [159.1]. El Tribunal Constitucional se compone de 12
      miembros [...]; cuatro a propuesta del Congreso [...]; cuatro a propuesta del Senado [...];
      dos a propuesta del Gobierno, y dos a propuesta del Consejo General del Poder Judicial.
