titulo: Listas cerradas, barrera del 5 %, cese por baja de partido y Diputaciones indirectas
resumen: >-
  Las Cortes aprobaron la Ley 39/1978, de 17 de julio (BOE del 21 de julio), que impuso en todos los
  ayuntamientos listas cerradas y bloqueadas (artículo 11.2), barrera del 5 % (artículo 11.3.b), el
  cese del concejal que dejara su partido (artículo 11.7) y Diputaciones elegidas indirectamente por
  concejales (artículo 33).
descargo: >-
  La norma reguló las primeras elecciones municipales democráticas desde 1931 y exceptuó el régimen de
  concejo abierto en municipios de menos de 25 residentes (artículo 5.2).
