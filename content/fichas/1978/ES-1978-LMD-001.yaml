    fragmento: >-
      Ley 39/1978, de 17 de julio, de elecciones locales [BOE núm. 173, 21 de julio de 1978]. De
      conformidad con la Ley aprobada por las Cortes, vengo en sancionar. [...] Artículo once
      [11.2]. Dos. Cada elector dará su voto a una sola lista, sin introducir en ella modificación
      alguna ni alterar en la misma el orden de colocación de los candidatos. Tres [11.3.b]. b) No
      serán tenidas en cuenta aquellas listas que no hubiesen obtenido, por lo menos, el cinco por
      ciento [5 %] de los votos válidos emitidos en el distrito. [...] Siete [11.7]. Tratándose de
      listas que representen a Partidos Políticos [...], si alguno de los candidatos electos dejare
      de pertenecer al Partido que le presentó, cesará en su cargo [...]. Artículo treinta y tres
      [33]. Realizada la asignación de puestos de Diputados a cada una de las listas, los Concejales
      [...] se reunirán por separado [...] para elegir por y entre ellos a quienes hayan de
      proclamarse Diputados por cada lista.
