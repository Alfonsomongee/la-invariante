  intento_de_refutacion: >-
    Se comprobó literalmente el art. 11.7 en el BOE: el precepto estableció el cese automático del
    concejal electo si dejaba el partido de su lista, concentrando el control del acta en las
    direcciones partidistas. Se incorpora el régimen de concejo abierto (art. 5.2) en descargo.
