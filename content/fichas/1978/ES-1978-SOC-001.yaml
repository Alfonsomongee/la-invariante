    fragmento: >-
      Ley 60/1978, de 23 de diciembre, de medidas urgentes en apoyo del sector siderúrgico, con
      concesión [...] de dos créditos extraordinarios, por importe total de 15.000.000.000 de
      pesetas [BOE núm. 307, 25 de diciembre de 1978]. Artículo primero. [...] cuatro mil millones
      de pesetas [...] para que el Instituto Nacional de Industria pueda suscribir cuatro millones
      de acciones del capital social de «Altos Hornos del Mediterráneo, S. A.». Artículo segundo.
      [...] once mil millones de pesetas [...] «Empresa Nacional Siderúrgica, Sociedad Anónima»
      [Ensidesa]. [...] Artículo quinto. [...] veintitrés mil quinientos millones [23.500.000.000]
      a financiar inversiones o capital circulante de «Altos Hornos del Mediterráneo, Sociedad
      Anónima», «Empresa Nacional Siderúrgica, S. A.», y «Altos Hornos de Vizcaya, S. A.» [...].
      Artículo sexto. El mayor gasto público derivado de los créditos extraordinarios [...] se
      financiará con anticipo del Banco de España y/o emisión de Deuda Pública Interior [...].
