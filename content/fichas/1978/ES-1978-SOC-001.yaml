titulo: Rescate siderúrgico de 15.000 millones en créditos y 23.500 en crédito oficial (Ley 60/1978)
resumen: >-
  Las Cortes aprobaron la Ley 60/1978, de 23 de diciembre (BOE del 25 de diciembre), con 15.000.000.000
  de pesetas (90.151.815,66 euros) en créditos extraordinarios financiados mediante Banco de España
  o deuda pública para Altos Hornos del Mediterráneo y Ensidesa, más 23.500.000.000 de pesetas en
  Crédito Oficial incluida la privada Altos Hornos de Vizcaya.
descargo: >-
  El artículo 4 condicionó los abonos al examen previo de cuentas y balances por la Intervención
  General de la Administración del Estado, el artículo 5.4 facultó al Gobierno a convertir en
  capital los créditos públicos a Altos Hornos de Vizcaya y la Disposición Adicional Primera obligó
  a informar semestralmente al Congreso.
