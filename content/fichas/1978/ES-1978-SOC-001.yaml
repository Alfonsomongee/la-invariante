  intento_de_refutacion: >-
    Se verificó la naturaleza privada de Altos Hornos del Mediterráneo y Altos Hornos de Vizcaya en
    la propia ley: el art. 4 alude expresamente a «los accionistas privados de Altos Hornos del
    Mediterráneo» y el art. 5.4 prevé la eventual conversión en capital público de los créditos a
    Altos Hornos de Vizcaya, acreditando asunción pública de capital y financiación de empresas
    privadas en crisis.
