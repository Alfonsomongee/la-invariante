  intento_de_refutacion: >-
    Se leyó íntegramente la Ley 12/1978 para confirmar que no otorgaba privilegios de retorno sino
    que restringió efectivamente el paso entre judicatura y cargos políticos suprimiendo la
    excedencia especial con reserva de plaza; el derecho general de reingreso del art. 2 consta en
    descargo.
