id: ES-1978-PGI-001
anuario: 1978
categoria: PGI
contraprueba: true
contraprueba_motivo: >-
  Las Cortes suprimieron la excedencia especial que permitía a magistrados del Tribunal Supremo,
  jueces y fiscales pasar a cargos políticos del Ejecutivo conservando su plaza judicial, pasando a
  excedencia voluntaria con pérdida de vacante.
partidos:
  - institucional
nivel: estatal
ambito_territorial: España
protagonistas: []
estado_procesal:
  actual: no_judicial
  historial: []
titulo: Supresión de la excedencia especial para jueces y fiscales en cargos políticos (Ley 12/1978)
resumen: >-
  Las Cortes aprobaron la Ley 12/1978, de 20 de febrero (BOE del 23 de febrero), que suprimió la
  excedencia especial para magistrados del Tribunal Supremo, jueces y fiscales nombrados para
  cargos políticos o de confianza, aplicando automáticamente la excedencia voluntaria y dejando
  vacante su plaza judicial (artículo 1).
descargo: >-
  El artículo 2 permitió solicitar posteriormente el reingreso al servicio activo conforme a las
  disposiciones orgánicas de cada carrera, y la Disposición Transitoria concedió tres meses de
  plazo de opción a quienes ya ocupaban cargos administrativos.
