    capturado: "2026-11-25"
    pagina: "4394-4395"
    fragmento: >-
      Ley 12/1978, de 20 de febrero [BOE núm. 46, 23 de febrero de 1978]. De conformidad con la Ley
      aprobada por las Cortes, vengo en sancionar. Artículo primero [1]. Uno. Queda sin efecto para
      los Magistrados del Tribunal Supremo, miembros de las carreras Judicial y Fiscal y Jueces y
      Fiscales de Distrito la posibilidad de acogerse a la situación de excedencia especial por su
      nombramiento por Decreto para cargo político o de confianza de carácter no permanente. [...]
      Tres. La toma de posesión del cargo determinará automáticamente la aplicación al nombrado del
      régimen previsto para la excedencia voluntaria, quedando vacante el respectivo cargo judicial
      o fiscal [...].
