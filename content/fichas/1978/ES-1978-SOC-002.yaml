    fragmento: >-
      Ley 21/1978, de 8 de mayo, sobre concesión de aval del Estado a la construcción de la
      Autopista de Navarra [BOE núm. 110, 9 de mayo de 1978]. De conformidad con la Ley aprobada por
      las Cortes, vengo en sancionar. Artículo 1. Se autoriza la concesión del aval del Estado, en
      garantía de las operaciones de crédito exterior [...]. Dos. [...] no se rebase en ningún caso
      la cifra de nueve mil millones de pesetas [9.000.000.000] [...]. Artículo 3. [...] aval del
      Tesoro Público [...]. Artículo 4. Uno. El Estado facilitará a la sociedad o sociedades
      concesionarias de la autopista de Navarra las divisas o monedas precisas para el pago de los
      principales e intereses [...] al mismo tipo de cambio de compra vigente el día en que se
      constituya el depósito [...] [seguro de cambio].
