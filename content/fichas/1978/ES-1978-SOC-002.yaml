titulo: Aval del Estado de 9.000 millones y seguro de cambio para la Autopista de Navarra (Ley 21/1978)
resumen: >-
  Las Cortes aprobaron la Ley 21/1978, de 8 de mayo (BOE del 9 de mayo), que autorizó un aval del
  Tesoro Público hasta 9.000.000.000 de pesetas (54.091.089,39 euros) para préstamos exteriores de
  la concesionaria de la Autopista de Navarra (artículo 1) y seguro de cambio asumido por el Estado
  (artículo 4).
descargo: >-
  El aval estatal tenía carácter subsidiario respecto de la garantía de la Diputación Foral de
  Navarra, devengaba una comisión anual del 2 por mil a favor del Tesoro (artículo 2) y el Estado
  repercutiría a la Diputación Foral los resultados del riesgo de cambio al revertir la autopista
  (artículo 4.2).
