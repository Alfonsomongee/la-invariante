  intento_de_refutacion: >-
    Se verificó la existencia de contraprestación: la concesionaria paga una comisión anual del 2
    por mil y una prima de seguro de cambio fijada por Consejo de Ministros (recogido en descargo),
    pero el art. 4 traslada al Estado y finalmente a la Diputación Foral el riesgo de depreciación
    cambiaria de la deuda exterior privada.
