titulo: Financiación estatal permanente de partidos políticos en la Ley 54/1978
resumen: >-
  Las Cortes aprobaron la Ley 54/1978, de 4 de diciembre (BOE del 8 de diciembre), cuyo artículo 6
  estableció la financiación estatal anual permanente de las actividades ordinarias de los partidos
  con cargo a los Presupuestos Generales del Estado según escaños y votos en ambas Cámaras.
descargo: >-
  La norma vinculó la financiación pública al reconocimiento del derecho de asociación política y
  exigió en su artículo 4 que la organización interna de los partidos se ajustase a principios
  democráticos y sufragio secreto, reservando la disolución a la autoridad judicial (artículo 5).
