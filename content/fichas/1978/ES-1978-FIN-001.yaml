  intento_de_refutacion: >-
    Se verificó si la ley incluía límites de financiación privada o auditoría del Tribunal de
    Cuentas; el artículo 6 remitió las cuantías globales a los Presupuestos Generales del Estado y
    no incorporó mecanismos específicos de fiscalización externa en la propia norma. Se recoge en
    descargo la exigencia de democracia interna y garantía judicial de disolución.
