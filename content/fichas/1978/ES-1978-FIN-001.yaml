    fragmento: >-
      Ley 54/1978, de 4 de diciembre, de Partidos Políticos [BOE núm. 293, 8 de diciembre de 1978].
      De conformidad con la Ley aprobada por las Cortes, vengo en sancionar. [...] Artículo sexto
      [6]. La Administración del Estado financiará las actividades de los partidos con arreglo a las
      siguientes normas: a) Cada partido percibirá anualmente una cantidad fija por cada escaño
      obtenido en cada una de las dos Cámaras y, asimismo, una cantidad fija por cada uno de los
      votos obtenidos por cada candidatura a cada una de las dos Cámaras. b) En los Presupuestos
      Generales del Estado se consignará la cantidad global destinada a estos fines [...].
