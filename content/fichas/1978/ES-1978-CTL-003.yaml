nivel: estatal
ambito_territorial: España
protagonistas: []
estado_procesal:
  actual: no_judicial
  historial: []
titulo: Tipificación penal del delito de tortura cometida por autoridades o funcionarios (Ley 31/1978)
resumen: >-
  Las Cortes aprobaron la Ley 31/1978, de 17 de julio (BOE del 20 de julio), que introdujo el
  artículo 204 bis en el Código Penal para castigar con pena en grado máximo e inhabilitación la
  tortura cometida por autoridades o funcionarios en investigaciones policiales, judiciales o
  prisiones, y a los superiores que la permitieran.
descargo: >-
  El tipo penal exigió que los hechos se cometieran en el curso de una investigación policial o
  judicial con el fin de obtener una confesión o testimonio, o en instituciones penitenciarias
  respecto de detenidos o presos, graduando las penas según la gravedad de las lesiones o
  intimidación.
