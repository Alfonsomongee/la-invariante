id: ES-1978-CTL-003
anuario: 1978
categoria: CTL
contraprueba: true
contraprueba_motivo: >-
  Las Cortes incorporaron por primera vez al Código Penal el delito específico de tortura cometida
  por autoridades o funcionarios policiales, judiciales y penitenciarios, ampliando el control penal
  sobre abusos del aparato estatal.
partidos:
