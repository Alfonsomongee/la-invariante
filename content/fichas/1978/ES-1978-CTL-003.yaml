    url: https://www.boe.es/diario_boe/xml.php?id=BOE-A-1978-18551
    sha256: 90e69751b8fd6e0c19a935d20dd8f5f1dd04368482c364017d3ad9e43baba847
    capturado: "2026-11-25"
    pagina: 17160
    fragmento: >-
      Ley 31/1978, de 17 de julio, de modificación del Código Penal para tipificar el delito de
      tortura [BOE núm. 172, 20 de julio de 1978]. De conformidad con la Ley aprobada por las
      Cortes [...]. Artículo único. Se introduce en el Código Penal un artículo doscientos cuatro
      bis [204 bis] [...]: La Autoridad o funcionario público que, en el curso de la investigación
      policial o judicial [...] será castigado con la pena señalada al delito en su grado máximo y,
      además, la de inhabilitación especial. [...] Instituciones Penitenciarias [prisiones] [...].
      Igualmente se impondrán las penas [...] a la Autoridad o funcionario que, faltando a los
      deberes de su cargo, permitiesen que otras personas ejecuten los hechos previstos en ellos.
