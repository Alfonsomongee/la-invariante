titulo: Detención prolongada, registros sin orden y escuchas gubernativas por decreto-ley (RDL 21/1978)
resumen: >-
  Mientras las Cortes tramitaban el proyecto de ley, el Gobierno de Adolfo Suárez aprobó el Real
  Decreto-ley 21/1978 (BOE del 1 de julio), que permitió prolongar la detención gubernativa con
  aceptación judicial tácita (artículo 2), habilitó registros con comunicación posterior al juez
  (artículo 3) y facultó al Ministro del Interior a ordenar escuchas (artículos 4 y 7).
descargo: >-
  La exposición de motivos invocó el repunte de atentados armados y una moción aprobada por el Pleno
  del Congreso el 28 de junio de 1978; fijó vigencia máxima de un año, deber de informar al juez
  competente para confirmar o revocar las escuchas y obligación de rendir cuentas periódicas a las
  Cortes (artículo 7.2).
