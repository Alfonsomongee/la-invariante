    fragmento: >-
      Real Decreto-ley 21/1978, de 30 de junio [BOE núm. 156, 1 de julio de 1978]. El Proyecto de
      Ley antes citado se encuentra actualmente en tramitación en las Cortes [...]. Artículo segundo
      [2]. [...] la detención gubernativa podrá prolongarse el tiempo necesario para los fines
      investigadores [...], entendiéndose que acepta tácitamente la prórroga si dejare transcurrir
      aquel plazo sin rechazarla. Artículo tercero [3]. [...] los delitos comprendidos en este Real
      Decreto-ley se considerarán siempre como flagrantes. La autoridad gubernativa comunicará al
      Juez competente el registro efectuado [...]. Artículo cuarto [4]. La autoridad gubernativa
      podrá ordenar la observación postal, telegráfica y telefónica [...]. Artículo séptimo [7]. Uno.
      Las facultades que en este Real Decreto-ley se atribuyen a la autoridad gubernativa se
      ejercerán exclusivamente por el Ministro del Interior. [...] El Presidente del Gobierno,
      Adolfo Suárez González.
