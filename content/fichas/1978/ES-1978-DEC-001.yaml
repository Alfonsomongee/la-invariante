  intento_de_refutacion: >-
    Se verificó la posterior Ley 56/1978 (BOE-A-1978-29845, 8-dic-1978), que sustituyó este RDL
    acotando la prórroga a 7 días adicionales y fijando plazo judicial de 72 horas para confirmar o
    revocar escuchas; el RDL 21/1978 ilustra el uso del decreto-ley sobre derechos procesales
    mientras las Cortes estaban en pleno trámite legislativo.
