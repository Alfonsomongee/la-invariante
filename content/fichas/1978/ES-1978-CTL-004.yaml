id: ES-1978-CTL-004
anuario: 1978
categoria: CTL
contraprueba: true
contraprueba_motivo: >-
  Las Cortes reformaron la Ley de Enjuiciamiento Criminal para garantizar asistencia de abogado
  desde la detención policial, derecho a guardar silencio e información inmediata de cargos,
  limitando la discrecionalidad en interrogatorios bajo custodia.
