  intento_de_refutacion: >-
    Se revisaron todas las salvedades del art. 520 (espera máxima de 8 horas y excepción judicial
    motivada para la comunicación familiar) y la coexistencia ese mismo día con la Ley 56/1978 de
    terrorismo; pese a esos límites (recogidos en descargo), la ley implantó la asistencia letrada
    en comisaría como norma general en el ordenamiento penal.
