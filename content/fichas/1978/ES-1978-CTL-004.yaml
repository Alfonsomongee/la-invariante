    fragmento: >-
      Ley 53/1978, de 4 de diciembre, por la que se modifican los artículos [...] 118 [...] y 520
      de la Ley de Enjuiciamiento Criminal [BOE núm. 293, 8 de diciembre de 1978]. De conformidad
      con la Ley aprobada por las Cortes [...]. Artículo ciento dieciocho [118]. Toda persona a
      quien se impute un acto punible podrá ejercitar el derecho de defensa [...] desde que se le
      comunique su existencia, haya sido objeto de detención [...]. Artículo quinientos veinte
      [520]. Todo detenido o preso debe ser informado [...] de las causas que han determinado su
      detención y de los derechos que le asisten. En ningún caso se le podrá compeler a prestar
      declaración si, invitado a hacerlo, se negare. [...] Desde el momento en que se practique su
      detención [...], el afectado tiene derecho a designar Abogado y a solicitar su presencia en
      el lugar de custodia para que asista al interrogatorio [...] y a que se comunique al familiar
      o a la persona que desee el hecho de su detención [...].
