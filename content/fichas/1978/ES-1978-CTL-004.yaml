titulo: Derecho de defensa y asistencia de abogado desde la detención en la LECrim (Ley 53/1978)
resumen: >-
  Las Cortes aprobaron la Ley 53/1978, de 4 de diciembre (BOE del 8 de diciembre), que reformó los
  artículos 118 y 520 de la Ley de Enjuiciamiento Criminal para garantizar desde la detención el
  derecho a conocer los motivos, guardar silencio, designar abogado en el lugar de custodia y
  comunicar la detención a un familiar.
descargo: >-
  El artículo 520 contempló dos límites: permitir el interrogatorio tras ocho horas de espera sin
  comparecencia de letrado notificado al Colegio de Abogados y restringir la comunicación familiar
  con autorización judicial motivada en supuestos de riesgo grave para la seguridad del Estado o de
  las personas.
