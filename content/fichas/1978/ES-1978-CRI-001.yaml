    fragmento: >-
      [19 de julio de 1978, Ministro del Interior Rodolfo Martín Villa] Producidos aquellos hechos,
      se ordena la entrada de la Policía Armada en la plaza de toros [de Pamplona], cuya actuación
      fue desproporcionada [...]. Con posterioridad [...], una Sección de la Compañía de la Reserva
      General [...] procede de forma incomprensible a causar destrozos y daños materiales en
      establecimientos y edificios de Rentería. [...] es innegable que tanto la herida mortal de
      Germán Rodríguez Sainz como la de José Ignacio Barandiarán Urcola se producen cuando en las
      calles se hostiga violentamente a las Fuerzas Públicas. [...] [Votación Comisión de Interior,
      pág. 4487] El apartado 1 [...] dice: «Que el señor Ministro del Interior asuma su
      responsabilidad [...] cuando su política de orden público ha fracasado». Efectuada la
      votación, fue rechazado el apartado 1 por 19 votos en contra y 14 a favor, con tres
      abstenciones. [...] El apartado 6 [...] «La anulación de la decisión de traslado del Comisario
      de Policía de Pamplona a la localidad de Chirivella». Efectuada la votación, fue rechazado por
      19 votos en contra y 17 a favor.
