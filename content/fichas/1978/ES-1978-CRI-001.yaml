  intento_de_refutacion: >-
    Se verificó la literalidad de los seis puntos votados en la Comisión de Interior (pág. 4487):
    se aprobaron los apartados 3 (tramitación urgente de la Ley de Policía) y 4 (exigencia de
    claridad informativa, 35 a favor y 1 abstención), mientras se rechazaron los puntos 1, 2, 5 y 6.
    Todos esos matices y la postura del ministro se recogen en descargo.
