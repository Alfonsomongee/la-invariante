titulo: Comparecencia por los sucesos de Pamplona, San Sebastián y Rentería y rechazo de responsabilidades
resumen: >-
  El 19 de julio de 1978, Rodolfo Martín Villa admitió en el Congreso la entrada de la Policía
  Armada en la plaza de toros de Pamplona, las muertes de Germán Rodríguez y José Ignacio
  Barandiarán y destrozos en Rentería; la Comisión rechazó exigirle responsabilidad (19 votos a 14)
  y anular el traslado del comisario (19 a 17).
descargo: >-
  Martín Villa atribuyó los incidentes a un clima de tensión callejera, sostuvo que la nota oficial
  inicial sobre un supuesto asalto al cuartel de San Sebastián resultó inexacta tras comprobarse los
  hechos, señaló que la responsabilidad correspondía a los mandos que ordenaron entrar en la plaza
  y apoyó aprobar el punto 4 pidiendo claridad sobre medidas disciplinarias (35 votos a favor).
