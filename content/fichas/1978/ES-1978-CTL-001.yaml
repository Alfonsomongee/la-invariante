    fragmento: >-
      Ley 48/1978, de 7 de octubre, por la que se modifica la Ley de 5 de abril de 1968, sobre
      Secretos Oficiales [BOE núm. 243, 11 de octubre de 1978]. De conformidad con la Ley aprobada
      por las Cortes [...]. Artículo cuarto [4]. La calificación a que se refiere el artículo
      anterior corresponderá exclusivamente, en la esfera de su competencia, al Consejo de Ministros
      y a la Junta de Jefes de Estado Mayor. [...] Artículo séptimo [7]. La cancelación de
      cualquiera de las calificaciones previstas en el artículo tercero de esta Ley será dispuesta
      por el órgano que hizo la respectiva declaración. [...] Artículo trece. Las actividades
      reservadas por declaración de Ley y las «materias clasificadas» no podrán ser comunicadas,
      difundidas ni publicadas [...].
