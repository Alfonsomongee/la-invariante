titulo: Reforma de la Ley de Secretos Oficiales de 1968 sin plazo de desclasificación (Ley 48/1978)
resumen: >-
  Las Cortes aprobaron la Ley 48/1978, de 7 de octubre (BOE del 11 de octubre), que reformó la Ley
  de 5 de abril de 1968 sobre Secretos Oficiales manteniendo en el Consejo de Ministros y la Junta
  de Jefes de Estado Mayor la clasificación y cancelación exclusiva de materias reservadas
  (artículos 4 y 7), sin plazo de desclasificación.
descargo: >-
  La reforma suprimió la facultad de clasificación que tenían los ministros individualmente y
  reconoció en el artículo 10.2 el acceso del Congreso y del Senado a materias clasificadas en la
  forma que determinasen sus Reglamentos, incluso en sesiones secretas.
